prefixes:
  ex: "http://example.com/"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  sosa: "http://www.w3.org/ns/sosa/"
  ssn: "http://www.w3.org/ns/ssn/"
  geo: "http://www.opengis.net/ont/geosparql#"
  dcterms: "http://purl.org/dc/terms/"
  qudt: "http://qudt.org/schema/qudt/"
  unit: "http://qudt.org/vocab/unit/"
  gn: "http://www.geonames.org/ontology#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  cdt: "https://ci.mines-stetienne.fr/lindt/v4/custom_datatypes#"

mappings:
  timeseries:
    sources:
      - access: ../CSV-data/vmm_ts_values_with_headers.csv
        referenceFormulation: csv
    s: ex:reading_$(ts_id)_$(Timestamp)
    po:
      - p: a
        o: sosa:Observation

      - p: sosa:resultTime
        o:
          value: $(Timestamp)
          datatype: xsd:dateTime

      - p: sosa:hasSimpleResult
        o:
          value: "$(Value)"
          datatype: xsd:string  # or xsd:double if numeric

      - p: ex:Interpolation_Type
        o:
          value: $(Interpolation Type)
          type: iri

      - p: ex:Quality_Code
        o:
          value: $(Quality Code)
          type: iri

      - p: ex:Quality_Code_Name
        o:
          value: "$(Quality Code Name)"
          datatype: xsd:string

      - p: ex:Quality_Code_Description
        o:
          value: "$(Quality Code Description)"
          datatype: xsd:string

      - p: ex:Quality_Code_color
        o:
          value: "$(Quality Code Color)"
          datatype: xsd:string  # assuming color in HEX, not a URI

      - p: ex:ts_id
        o:
          value: $(ts_id)
          type: iri
